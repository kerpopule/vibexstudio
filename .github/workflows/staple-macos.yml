name: staple-macos

# Staples the notarization ticket to a release DMG and re-uploads it.
# Needs no secrets: stapling fetches the (already-issued) ticket from Apple
# by the DMG's code signature. Run after a locally notarized DMG is uploaded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag holding the DMG
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  staple:
    runs-on: macos-latest
    steps:
      - name: Download DMG from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "*.dmg" --dir .
          ls -la *.dmg
      - name: Staple + verify
        run: |
          for f in *.dmg; do
            xcrun stapler staple "$f"
            xcrun stapler validate "$f"
            spctl -a -t open --context context:primary-signature -vv "$f"
          done
      - name: Re-upload stapled DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --clobber *.dmg
