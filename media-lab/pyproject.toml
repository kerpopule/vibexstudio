[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-lab-controller"
version = "0.1.0.dev0"
description = "Local-first orchestration and QA for pluggable generative-media engines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "py-vapid>=1.9,<2",
  "pywebpush>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "qrcode>=7.4,<9",
  "Pillow>=10,<13",
  "psutil>=7.2,<8",
]

[project.optional-dependencies]
image = ["numpy>=2,<3", "opencv-python-headless>=4.10,<5", "Pillow>=11,<13"]
dev = ["build>=1.2,<2", "httpx>=0.27,<1", "pip-audit>=2.7,<3", "pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
media-lab-preflight = "media_lab_core.preflight:main"
media-lab-setup = "media_lab_core.setup_wizard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["media_lab_core*"]

[tool.setuptools.package-data]
media_lab_core = ["data/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "spark: needs the Spark host's private productions/ or image-svc/ tree, or a live engine on that host; exclude with -m 'not spark' (not -k, which also matches test names)",
  "gpu: needs a resident GPU engine on the machine running the suite (no tracked test requires one today; the engine boundaries are mocked)",
]
