# Prevent restart storms from importing app.py and consuming job recovery
# attempts while the fixed Tailscale bind address is temporarily absent.
# The service stays in "activating" until tailscale0 owns the canonical /32;
# it does not start a worker, mutate jobs.json, or touch a video engine early.
# The address is MEDIA_LAB_TAILNET_HOST from config/local.env (an IPv4 literal);
# with no tailnet host configured the gate is a no-op.
[Service]
EnvironmentFile=-%h/media-lab-simple/config/local.env
ExecStartPre=/bin/bash -lc 'h="$${MEDIA_LAB_TAILNET_HOST:-}"; case "$$h" in ""|*[!0-9.]*) exit 0;; esac; until /usr/sbin/ip -4 addr show tailscale0 2>/dev/null | /usr/bin/grep -q "inet $$h/32"; do /usr/bin/sleep 2; done'
TimeoutStartSec=0
